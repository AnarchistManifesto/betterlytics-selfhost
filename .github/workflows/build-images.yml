name: Build and Push Custom Betterlytics Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'          # Daily at 03:00 UTC
  workflow_dispatch:              # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/betterlytics-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push each image
      - name: Build and push betterlytics-selfhost
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-selfhost:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push postgres
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-postgres:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push clickhouse
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.clickhouse
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-clickhouse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
